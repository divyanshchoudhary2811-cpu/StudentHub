<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudentHub - Student Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Sidebar -->
    <aside class="sidebar">

        <h2>🎓 StudentHub</h2>

        <nav>
            <a href="#" class="active">🏠 Dashboard</a>
            <a href="#">👨‍🎓 Students</a>
            <a href="#">➕ Add Student</a>
            <a href="#">📊 Reports</a>
            <a href="#">⚙️ Settings</a>
        </nav>

    </aside>


    <!-- Main Content -->
    <main class="main-content">

        <!-- Header -->
        <header class="header">

            <div>
                <h1>Dashboard</h1>
                <p>Welcome back, Divyansh!</p>
            </div>

            <div class="Divyansh">
                👤 Divyansh
            </div>

        </header>


        <!-- Statistics -->
        <section class="stats">

           <div class="card">
    <h3>Total Students</h3>
    <p id="totalStudents">0</p>
</div>

<div class="card">
    <h3>Active Students</h3>
    <p id="activeStudents">0</p>
</div>

<div class="card">
    <h3>Courses</h3>
    <p id="totalCourses">0</p>
</div>

<div class="card">
    <h3>Average Grade</h3>
    <p id="averageGrade">-</p>
</div>
        </section>

<!-- Add Student Form -->

<section class="add-student-section" id="addStudentForm">

    <h2>Add New Student</h2>

    <form id="studentForm">

        <div class="form-group">
            <label for="studentName">Student Name</label>
            <input
                type="text"
                id="studentName"
                placeholder="Enter student name"
                required
            >
        </div>

        <div class="form-group">
            <label for="studentId">Student ID</label>
            <input
                type="text"
                id="studentId"
                placeholder="Example: ST004"
                required
            >
        </div>

        <div class="form-group">
            <label for="course">Course</label>

            <select id="course" required>
                <option value="">Select Course</option>
                <option value="BCA">BCA</option>
                <option value="B.Tech">B.Tech</option>
                <option value="BBA">BBA</option>
                <option value="MCA">MCA</option>
            </select>
        </div>

        <div class="form-group">
            <label for="grade">Grade</label>

            <select id="grade" required>
                <option value="">Select Grade</option>
                <option value="A+">A+</option>
                <option value="A">A</option>
                <option value="B+">B+</option>
                <option value="B">B</option>
                <option value="C">C</option>
            </select>
        </div>

        <button type="submit" class="save-btn">
            Add Student
        </button>

    </form>

</section>

            <!-- Recent Students -->
        <section class="students-section">

            <div class="section-header">

    <h2>Students</h2>

    <div class="student-actions">

        <input
            type="text"
            id="searchInput"
            placeholder="🔍 Search students..."
        >

        <button id="addStudentBtn">
            + Add Student
        </button>

    </div>

</div>


            <div class="table-container">

                <table>

                    <thead>
                        <thead>
                    <tr>
                        <th>Name</th>
                        <th>Student ID</th>
                        <th>Course</th>
                        <th>Grade</th>
                        <th>Actions</th>
                    </tr>
</thead>
                    </thead>

                    <tbody id="studentTableBody">

</tbody>

                </table>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
